<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0d0d0f"/>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.6"/>
  <text x="16" y="22" font-family="JetBrains Mono, monospace" font-size="18" font-weight="900" fill="#00f5ff" text-anchor="middle" filter="url(#glow)">H</text>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
